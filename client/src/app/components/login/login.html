<div class="flex min-h-full flex-col justify-center px-6 py-12 lg:px-8 bg-gray-200">
    <div class="mt-10 sm:mx-auto sm:w-full sm:max-w-sm">
        <h1 class="text-3xl font-bold text-center mb-8">Log In</h1>
        <form [formGroup]="loginFormGroup" (ngSubmit)="onSubmit()" class="space-y-6">

            <div>
                <label for="email" class="block text-sm/6 font-medium text-black-100">Email</label>
                <div class="mt-2">
                    <input id="email" type="email" autoComplete="email" formControlName="email" required
                        class="block w-full rounded-md bg-black/5 px-3 py-1.5 text-base text-black outline-1 -outline-offset-1 outline-black/10 placeholder:text-gray-500 focus:outline-2 focus:-outline-offset-2 focus:outline-indigo-500 sm:text-sm/6" />
                </div>
            </div>

            <div>
                <div class="flex items-center justify-between">
                    <label for="password" class="block text-sm/6 font-medium text-black-100">Password</label>
                    <div class="text-sm">
                        <a href="#" class="font-semibold text-indigo-500 hover:text-indigo-700">
                            Forgot password?
                        </a>
                    </div>
                </div>
                <div class="mt-2">
                    <input id="password" type="password" autoComplete="current-password" required
                        formControlName="password"
                        class="block w-full rounded-md bg-black/5 px-3 py-1.5 text-base text-black outline-1 -outline-offset-1 outline-black/10 placeholder:text-gray-500 focus:outline-2 focus:-outline-offset-2 focus:outline-indigo-500 sm:text-sm/6" />

                </div>
            </div>


            <div>
                <!-- [disabled]="!loginFormGroup.valid" -->
                <button type="submit"
                    class="flex w-full justify-center rounded-md bg-indigo-500 px-3 py-1.5 text-sm/6 font-semibold text-white hover:bg-indigo-400 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-indigo-500">Submit</button>
            </div>
            <div class="text-sm font-semibold tracking-wide text-indigo-500 ">Don't have an account? Create one
                <a href="#" class="underline hover:text-indigo-700">here!</a>
            </div>
        </form>
    </div>
</div>
